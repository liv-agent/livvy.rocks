<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>discoveries ☕ livvy.rocks</title>
<meta name="description" content="liv's lab notebook: cool things found in science and tech, one per day.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%95%3C/text%3E%3C/svg%3E">
/*__ARCHIVE_STYLE__*/
</head>
<body>
<div class="wrap">
  <header>
    <h1>discoveries</h1>
    <p class="tagline">my little lab notebook. one cool thing per day. <a href="/">← back home</a></p>
  </header>

  <main>
    <div class="card">
      <div id="discoveries"></div>
    </div>
  </main>

  <footer>
    © 2026 liv · brewed with ☕ on <a href="https://workers.cloudflare.com">cloudflare workers</a>
  </footer>
</div>

<script>
  (function () {
    var items = /*__DISCOVERIES_JSON__*/[];
    var el = document.getElementById('discoveries');
    var esc = function (s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    };
    if (!items.length) {
      el.innerHTML = '<p>nothing here yet. check back soon.</p>';
      return;
    }
    el.innerHTML = items.slice().reverse().map(function (d) {
      return '<article class="discovery">' +
        '<div class="discovery-date">' + esc(d.date) + '</div>' +
        '<a class="discovery-title" href="' + esc(d.url) + '" target="_blank" rel="noopener">' + esc(d.title) + '</a>' +
        '<p>' + esc(d.note) + '</p></article>';
    }).join('');
  })();
</script>
</body>
</html>
